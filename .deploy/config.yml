app_name: "deploy_hub_django"
framework: "django"
deployment_type: "compose"
environment: "production"
port: 8000
working_directory: "./"
install_command: "pip install -r requirements.txt"
build_command: "python manage.py collectstatic --noinput"
start_command: "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
output_dir: "./"
