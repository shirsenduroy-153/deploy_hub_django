version: '3.8'

services:
  deploy-hub-django-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: deploy-hub-django-app:latest
    container_name: deploy_hub_django_container
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PORT=8000
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
