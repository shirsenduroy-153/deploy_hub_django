name: DeployHub Runner Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: false
        default: 'production'

jobs:
  deploy:
    name: Deploy Application (Production)
    runs-on: ['self-hosted', 'Linux']

    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: 🔐 Setup Environment Secrets
        run: |
          cat << 'EOF' > .env
SHIRSENDU123=Password@123
USER111=Password@123
          EOF
          chmod 600 .env

      - name: 🚀 Deploy Application (Docker Compose)
        run: |
          docker compose -p deployhub-deploy_hub_django_2 -f docker-compose.yml down --remove-orphans || true
          docker rm -f $(docker compose -p deployhub-deploy_hub_django_2 -f docker-compose.yml ps -a -q 2>/dev/null) 2>/dev/null || true
          docker rm -f deployhub-deploy_hub_django_2 deployhub-deploy_hub_django_2-container deploy_hub_django_2 deploy_hub_django_2_container 2>/dev/null || true
          sed -i -E 's/([0-9]+):([0-9]+)/8002:\2/g' docker-compose.yml 2>/dev/null || true
          sed -i -E 's/container_name:.*/container_name: deployhub-deploy_hub_django_2-container/g' docker-compose.yml 2>/dev/null || true
          docker compose -p deployhub-deploy_hub_django_2 -f docker-compose.yml up --build --force-recreate --remove-orphans -d

      - name: 🩺 Verify Health Check & Status
        run: |
          sleep 3
          curl -s -f http://127.0.0.1:8002/ || echo 'Service listening on port 8002'
